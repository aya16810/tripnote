<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRIPNOTE — 雲端共編旅行工作台</title>
<style>
:root{--bg:#f5f4ef;--paper:#fffdf8;--ink:#1e211d;--muted:#73766f;--line:#dddcd3;--accent:#d85b3f;--soft:#eee9df;--green:#526c59}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(255,253,248,.9);position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}
.logo{font-weight:900;letter-spacing:.12em}.logo span{font-weight:500;color:var(--muted);font-size:12px;margin-left:10px}.top-actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:var(--paper);padding:10px 14px;border-radius:10px}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.ghost{background:transparent}
.layout{display:grid;grid-template-columns:230px 1fr 320px;max-width:1500px;margin:auto;min-height:calc(100vh - 72px)}
.sidebar{border-right:1px solid var(--line);padding:28px 18px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:800}.trip-title{font-size:27px;font-weight:900;line-height:1.1;margin:10px 0 6px}.trip-meta{font-size:13px;color:var(--muted);line-height:1.7}.nav{margin-top:30px;display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:9px}.nav button.active,.nav button:hover{background:var(--soft);font-weight:800}.mini-card{margin-top:30px;border-top:1px solid var(--line);padding-top:20px}.mini-row{display:flex;justify-content:space-between;margin:10px 0;font-size:13px}.content{padding:34px 38px;max-width:820px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;margin-bottom:30px}.hero h1{font-size:42px;line-height:1.05;margin:8px 0}.hero p{color:var(--muted);max-width:570px;line-height:1.7}.date-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px;align-items:center;}.date-tab{min-width:92px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px;text-align:left;transition:all 0.2s}.date-tab.active{background:var(--ink);color:#fff}.date-tab b{display:block;font-size:18px}.date-tab small{opacity:.7}.section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px}.section-head h2{margin:0;font-size:19px}.place-list{display:grid;gap:12px}.place{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:17px;display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:start}.num{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:800}.place h3{margin:0 0 5px;font-size:17px}.place p{margin:0;color:var(--muted);font-size:13px;line-height:1.55;word-break:break-all}.tag{display:inline-block;font-size:11px;background:#e9eee9;color:var(--green);padding:4px 7px;border-radius:999px;margin-top:8px}.place-actions{display:flex;gap:6px}.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px;font-size:13px;transition:0.1s}.iconbtn:hover{background:var(--soft)}.empty{padding:30px;border:1px dashed #c9c8c0;border-radius:14px;text-align:center;color:var(--muted);font-size:14px}
.right{border-left:1px solid var(--line);padding:24px;background:#f0eee7}.side-card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.side-card h3{margin:0 0 13px}.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ebe9e1;font-size:13px;align-items:center;}.stat:last-child{border-bottom:0}.todo{display:flex;gap:9px;align-items:center;padding:7px 0;font-size:13px}.todo input[type="checkbox"]{accent-color:var(--ink)}
.stat input[type="text"] {border:1px solid transparent; background:transparent; text-align:right; font-weight:bold; width:60%; padding:4px;} .stat input[type="text"]:focus {border-bottom:1px solid var(--ink); outline:none;}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:30;backdrop-filter:blur(3px)}.modal.show{display:flex}.dialog{width:min(600px,100%);background:var(--paper);border-radius:18px;padding:24px;box-shadow:0 20px 70px #0003}.dialog h2{margin-top:0}.form{display:grid;gap:12px}.form label{font-size:12px;font-weight:800}.form input,.form textarea,.form select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.form textarea{min-height:80px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:white;padding:12px 16px;border-radius:10px;display:none;z-index:40}.toast.show{display:block}
#tripSelector{width:100%;margin-top:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);font-weight:bold;background:var(--paper);outline:none}
.buffer-place{grid-template-columns:1fr auto;padding:14px}
@media(max-width:1100px){.layout{grid-template-columns:190px 1fr}.right{display:none}}@media(max-width:720px){.top{padding:0 16px}.top-actions .btn:not(.primary){display:none}.layout{display:block}.sidebar{display:none}.content{padding:22px 16px}.hero h1{font-size:32px}.hero{display:block}.place{grid-template-columns:34px 1fr}.place-actions{grid-column:2}.place-actions .iconbtn{font-size:12px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">TRIPNOTE <span id="syncStatus">☁️ 連線中...</span></div>
  <div class="top-actions">
    <button class="btn" onclick="exportTrip()">匯出備份</button>
    <button class="btn primary" onclick="openModal()">＋ 新增地點</button>
  </div>
</header>
<div class="layout">
<aside class="sidebar">
  <div class="eyebrow" style="display:flex; justify-content:space-between; align-items:center;">
    <span>SELECT TRIP</span>
    <button onclick="createNewTrip()" style="border:none; background:transparent; font-size:16px; font-weight:bold; color:var(--ink);">+</button>
  </div>
  <select id="tripSelector" onchange="switchTrip(this.value)"></select>
  
  <div class="trip-title" id="sidebarTitle" style="margin-top:20px;"></div>
  <div class="trip-meta" id="sidebarDate"></div>
  
  <div class="nav">
    <button class="active">行程總覽</button>
    <button onclick="scrollToSection('todo')">行前準備</button>
    <button onclick="scrollToSection('info')">旅行資訊</button>
  </div>
  
  <div class="mini-card">
    <div class="eyebrow">TRIP STATUS</div>
    <div class="mini-row"><span>旅行天數</span><b id="daysCount">0</b></div>
    <div class="mini-row"><span>已排地點</span><b id="placesCount">0</b></div>
    <div class="mini-row"><span>緩衝箱</span><b id="bufferCount">0</b></div>
  </div>
</aside>
<main class="content">
  <section class="hero">
    <div>
      <div class="eyebrow">WORKSPACE (雲端即時同步中)</div>
      <h1>慢慢把想去的地方，<br>排成一趟旅行。</h1>
      <p>只要將網址傳給旅伴，你們就能隨時隨地共同編輯這份行程表。</p>
    </div>
  </section>
  
  <div class="date-tabs" id="dateTabs"></div>
  <div class="section-head">
    <h2 id="dayTitle">Day 1</h2>
    <div>
      <button class="btn ghost" onclick="editDayTitle()" style="font-size:12px; padding:6px 10px;">✎ 改標題</button>
      <button class="btn" onclick="openModal()">＋ 新增地點</button>
    </div>
  </div>
  <div class="place-list" id="places"></div>
  
  <section id="todo" style="margin-top:50px;">
    <div class="section-head"><h2>行前準備清單</h2></div>
    <div class="side-card">
      <div class="todo"><input type="checkbox" id="todo1" onchange="updateCheckbox('todo1', this.checked)"> 護照與實體證件</div>
      <div class="todo"><input type="checkbox" id="todo2" onchange="updateCheckbox('todo2', this.checked)"> 申請 Visit Japan Web</div>
      <div class="todo"><input type="checkbox" id="todo3" onchange="updateCheckbox('todo3', this.checked)"> 購買 eSIM / 網卡</div>
      <div class="todo"><input type="checkbox" id="todo4" onchange="updateCheckbox('todo4', this.checked)"> 確認行李寄送</div>
    </div>
  </section>
  
  <section id="info">
    <div class="section-head"><h2>旅行資訊 (點擊右側直接編輯)</h2></div>
    <div class="side-card">
      <div class="stat"><span>去程航班</span><input type="text" id="infoOutbound" onchange="updateInfo('outbound', this.value)"></div>
      <div class="stat"><span>回程航班</span><input type="text" id="infoInbound" onchange="updateInfo('inbound', this.value)"></div>
      <div class="stat"><span>住宿地點</span><input type="text" id="infoHotel" onchange="updateInfo('hotel', this.value)"></div>
    </div>
  </section>
</main>

<aside class="right">
  <div class="eyebrow" style="margin-bottom:10px;">BUFFER BOX</div>
  <h2 style="margin:0 0 15px; font-size:19px;">行程緩衝箱</h2>
  <div class="place-list" id="bufferBoxList"></div>
</aside>
</div></div>

<div class="modal" id="modal">
  <div class="dialog">
    <h2>新增旅行地點</h2>
    <div class="form">
      <label>地點名稱<input id="name" placeholder="例如：東急 Stay 函館早市"></label>
      <label>參考網址 / 地圖連結<input id="url" placeholder="https://maps.google.com/..."></label>
      <label>分類<input id="category" placeholder="美食、住宿、景點、購物…"></label>
      <label>備註<textarea id="note" placeholder="例如：下午 2 點前抵達"></textarea></label>
      <label>加入位置
        <select id="targetLocation"><option value="current">加入目前的日期</option><option value="buffer">放入緩衝箱 (稍後安排)</option></select>
      </label>
    </div>
    <div class="dialog-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="addPlace()">儲存</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ==========================================
// 1. Firebase 設定與初始化
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyC5pQYrY-8mTxPKcyJshV1fmqcvf3kx07Y",
  authDomain: "tripnote-app.firebaseapp.com",
  projectId: "tripnote-app",
  storageBucket: "tripnote-app.firebasestorage.app",
  messagingSenderId: "636741950831",
  appId: "1:636741950831:web:3ac07c37b3f001883adc9a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const tripDocRef = db.collection("workspaces").doc("my-shared-trip");

const defaultState = {
  currentTripId: "hokkaido_2026",
  trips: {
    "hokkaido_2026": {
      title: "冬日北海道", dateRange: "2026.12.03 — 12.10",
      info: { outbound: "12/03 12:00 BR116", inbound: "12/10 15:30 BR115", hotel: "東急 Stay 函館早市" },
      todos: { todo1: false, todo2: false, todo3: false, todo4: false },
      days: [{ date: '12/03', title: '抵達函館', places: [{ n: '新千歲機場', a: '機場午餐', c: '交通', url: '' }] }],
      bufferBox: [{ n: '幸運小丑漢堡', a: '函館車站前分店', c: '備案美食', url: '' }]
    }
  }
};

let globalState = null;
let currentTrip = null;
let currentDayIndex = 0;

// ==========================================
// 2. 核心功能：監聽雲端資料
// ==========================================
tripDocRef.onSnapshot((docSnap) => {
  if (docSnap.exists) {
    globalState = docSnap.data();
    for(let key in globalState.trips) {
      if(!globalState.trips[key].todos) globalState.trips[key].todos = {};
    }
    document.getElementById('syncStatus').textContent = '🟢 已同步';
    renderUI(); 
  } else {
    globalState = defaultState;
    saveToCloud();
  }
});

// ==========================================
// 3. 核心功能：寫入雲端
// ==========================================
function saveToCloud() {
  document.getElementById('syncStatus').textContent = '🔄 儲存中...';
  tripDocRef.set(globalState).catch(err => {
    console.error("同步失敗", err);
    document.getElementById('syncStatus').textContent = '🔴 同步失敗';
  });
}

// ==========================================
// 4. UI 渲染邏輯
// ==========================================
function renderUI() {
  currentTrip = globalState.trips[globalState.currentTripId];
  document.getElementById('sidebarTitle').innerHTML = currentTrip.title.replace(' ', '<br>');
  document.getElementById('sidebarDate').innerHTML = `DATE<br>${currentTrip.dateRange}`;
  
  const selector = document.getElementById('tripSelector');
  selector.innerHTML = '';
  for (const tripId in globalState.trips) {
    const option = document.createElement('option');
    option.value = tripId;
    option.textContent = globalState.trips[tripId].title;
    if (tripId === globalState.currentTripId) option.selected = true;
    selector.appendChild(option);
  }

  const tabsHTML = currentTrip.days.map((d, i) => `
    <button class="date-tab ${i === currentDayIndex ? 'active' : ''}" onclick="selectDay(${i})">
      <small>DAY ${i + 1}</small><b>${d.date}</b>
    </button>
  `).join('');
  document.getElementById('dateTabs').innerHTML = tabsHTML + `<button class="date-tab" onclick="addNewDay()" style="border-style:dashed; background:transparent; color:var(--muted);"><b>＋ 新增</b></button>`;

  let d = currentTrip.days[currentDayIndex];
  document.getElementById('dayTitle').textContent = `Day ${currentDayIndex + 1} · ${d.title}`;
  document.getElementById('places').innerHTML = d.places.map((p, i) => `
    <article class="place">
      <div class="num">${String(i + 1).padStart(2, '0')}</div>
      <div><h3>${p.n}</h3><p>${p.a}</p><span class="tag">${p.c}</span></div>
      <div class="place-actions">
        <button class="iconbtn" onclick="${p.url ? `window.open('${p.url}', '_blank')` : `toast('未提供連結')`}">地圖</button>
        <button class="iconbtn" onclick="moveToBuffer(${i})">移至緩衝箱</button>
        <button class="iconbtn" onclick="removePlace(${i}, 'day')">刪除</button>
      </div>
    </article>
  `).join('') || '<div class="empty">今日尚無行程</div>';

  document.getElementById('bufferBoxList').innerHTML = currentTrip.bufferBox.map((p, i) => `
    <article class="place buffer-place">
      <div><h3 style="font-size: 15px; margin-bottom:3px">${p.n}</h3><p style="font-size: 12px; margin-bottom:5px">${p.a}</p><span class="tag">${p.c}</span></div>
      <div class="place-actions" style="flex-direction: column; gap:4px">
        <button class="iconbtn" onclick="moveFromBuffer(${i})">排入本日</button>
        <button class="iconbtn" onclick="removePlace(${i}, 'buffer')">刪除</button>
      </div>
    </article>
  `).join('') || '<div class="empty">緩衝箱目前是空的</div>';

  document.getElementById('infoOutbound').value = currentTrip.info.outbound || '';
  document.getElementById('infoInbound').value = currentTrip.info.inbound || '';
  document.getElementById('infoHotel').value = currentTrip.info.hotel || '';
  
  ['todo1','todo2','todo3','todo4'].forEach(id => {
    document.getElementById(id).checked = currentTrip.todos[id] || false;
  });

  document.getElementById('daysCount').textContent = currentTrip.days.length;
  document.getElementById('placesCount').textContent = currentTrip.days.reduce((a, d) => a + d.places.length, 0);
  document.getElementById('bufferCount').textContent = currentTrip.bufferBox.length;
}

// ==========================================
// 5. 互動事件
// ==========================================
function selectDay(index) { currentDayIndex = index; renderUI(); }
function switchTrip(tripId) { globalState.currentTripId = tripId; currentDayIndex = 0; saveToCloud(); }

function createNewTrip() {
  const title = prompt("請輸入新行程名稱：");
  if (!title) return;
  const tripId = 'trip_' + Date.now();
  globalState.trips[tripId] = { title: title, dateRange: "點擊編輯日期", info: { outbound: "", inbound: "", hotel: "" }, todos: {}, days: [{ date: 'Day 1', title: '抵達', places: [] }], bufferBox: [] };
  globalState.currentTripId = tripId;
  currentDayIndex = 0;
  saveToCloud();
}
function addNewDay() {
  const dateStr = prompt("請輸入新日期的標籤：");
  if (!dateStr) return;
  currentTrip.days.push({ date: dateStr, title: '新的一天', places: [] });
  currentDayIndex = currentTrip.days.length - 1; 
  saveToCloud();
}
function editDayTitle() {
  const newTitle = prompt("修改本日標題：", currentTrip.days[currentDayIndex].title);
  if (newTitle !== null) { currentTrip.days[currentDayIndex].title = newTitle; saveToCloud(); }
}

function moveFromBuffer(bufferIndex) {
  currentTrip.days[currentDayIndex].places.push(currentTrip.bufferBox.splice(bufferIndex, 1)[0]);
  saveToCloud();
}
function moveToBuffer(dayIndex) {
  currentTrip.bufferBox.push(currentTrip.days[currentDayIndex].places.splice(dayIndex, 1)[0]);
  saveToCloud();
}
function removePlace(index, type) {
  if(type === 'day') currentTrip.days[currentDayIndex].places.splice(index, 1);
  if(type === 'buffer') currentTrip.bufferBox.splice(index, 1);
  saveToCloud();
}
function updateInfo(key, value) { currentTrip.info[key] = value; saveToCloud(); }
function updateCheckbox(id, isChecked) { currentTrip.todos[id] = isChecked; saveToCloud(); }

function openModal() { document.getElementById('modal').classList.add('show'); document.getElementById('name').focus(); }
function closeModal() { document.getElementById('modal').classList.remove('show'); }
function addPlace() {
  let n = document.getElementById('name').value.trim();
  if(!n) return toast('請先輸入地點名稱');
  
  const newPlace = { n: n, url: document.getElementById('url').value.trim(), a: document.getElementById('note').value.trim() || '尚未填寫備註', c: document.getElementById('category').value.trim() || '未分類' };
  const target = document.getElementById('targetLocation').value;
  if(target === 'buffer') { currentTrip.bufferBox.push(newPlace); } else { currentTrip.days[currentDayIndex].places.push(newPlace); }
  
  ['name','url','category','note'].forEach(x => document.getElementById(x).value = '');
  closeModal();
  saveToCloud();
}

function scrollToSection(id) { document.getElementById(id).scrollIntoView({behavior:'smooth'}); }
function toast(t) {
  let x = document.getElementById('toast');
  x.textContent = t; x.classList.add('show');
  setTimeout(() => x.classList.remove('show'), 1800);
}
function exportTrip() {
  let a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(globalState, null, 2)], {type: 'application/json'}));
  a.download = 'tripnote_cloud_backup.json'; a.click(); toast('備份已匯出');
}
</script>
</body>
</html>
